<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Kristal Yapıları (FCC, BCC, HCP)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
        }
        button {
            background: #2ea44f;
            color: white;
            border: none;
            padding: 8px 16px;
            margin-right: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #2c974b;
        }
        button.active {
            background: #0969da;
        }
        #info {
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
    <!-- Three.js ve OrbitControls Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="controls">
        <button id="btnFCC" class="active" onclick="switchStructure('FCC')">FCC (YMK)</button>
        <button id="btnBCC" onclick="switchStructure('BCC')">BCC (HMK)</button>
        <button id="btnHCP" onclick="switchStructure('HCP')">HCP (Sık Düzen Altıgen)</button>
        <div id="info">Yüzey Merkezli Kübik (FCC) Yapı Gösteriliyor</div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let currentGroup = new THREE.Group();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e24);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(4, 3, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.clippingPlanes = []; // Kırpma düzlemleri için
            renderer.localClippingEnabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Işıklandırma
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(5, 10, 7);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
            dirLight2.position.set(-5, -5, -5);
            scene.add(dirLight2);

            scene.add(currentGroup);

            // Başlangıç yapısı: FCC
            buildFCC();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createUnitCellWireframe(width, height, depth) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const wireframe = new THREE.WireframeGeometry(geometry);
            const line = new THREE.LineSegments(wireframe);
            line.material.color.setHex(0xaaaaaa);
            line.material.linewidth = 2;
            return line;
        }

        function createAtomWithClipping(x, y, z, radius, planes) {
            const atomGroup = new THREE.Group();

            // 1. Hücre İçindeki Katı Kısım (Solid)
            const solidGeo = new THREE.SphereGeometry(radius, 64, 64);
            const solidMat = new THREE.MeshPhongMaterial({
                color: 0x3a9bdc,
                shininess: 80,
                clippingPlanes: planes,
                clipIntersection: false,
                side: THREE.DoubleSide
            });
            const solidMesh = new THREE.Mesh(solidGeo, solidMat);
            solidMesh.position.set(x, y, z);
            atomGroup.add(solidMesh);

            // 2. Hücre Dışındaki Saydam Tam Küre (Ghost Sphere)
            const ghostGeo = new THREE.SphereGeometry(radius, 32, 32);
            const ghostMat = new THREE.MeshPhongMaterial({
                color: 0x7ac1ed,
                transparent: true,
                opacity: 0.25,
                depthWrite: false
            });
            const ghostMesh = new THREE.Mesh(ghostGeo, ghostMat);
            ghostMesh.position.set(x, y, z);
            atomGroup.add(ghostMesh);

            return atomGroup;
        }

        // --- FCC Yapısı ---
        function buildFCC() {
            clearGroup();
            const R = 0.35;
            const a = 2 * Math.sqrt(2) * R; // Sert küre çakışma bağıntısı

            // Birim hücre sınır düzlemleri (Clipping Planes)
            const half = a / 2;
            const planes = [
                new THREE.Plane(new THREE.Vector3(1, 0, 0), half),
                new THREE.Plane(new THREE.Vector3(-1, 0, 0), half),
                new THREE.Plane(new THREE.Vector3(0, 1, 0), half),
                new THREE.Plane(new THREE.Vector3(0, -1, 0), half),
                new THREE.Plane(new THREE.Vector3(0, 0, 1), half),
                new THREE.Plane(new THREE.Vector3(0, 0, -1), half)
            ];

            // Çerçeve
            currentGroup.add(createUnitCellWireframe(a, a, a));

            // Atom Konumları (Köşeler + Yüzey Merkezleri)
            const positions = [
                // Köşeler (8 adet)
                [-half, -half, -half], [half, -half, -half], [-half, half, -half], [half, half, -half],
                [-half, -half, half],  [half, -half, half],  [-half, half, half],  [half, half, half],
                // Yüzey Merkezleri (6 adet)
                [0, 0, half], [0, 0, -half],
                [0, half, 0], [0, -half, 0],
                [half, 0, 0], [-half, 0, 0]
            ];

            positions.forEach(pos => {
                currentGroup.add(createAtomWithClipping(pos[0], pos[1], pos[2], R, planes));
            });
        }

        // --- BCC Yapısı ---
        function buildBCC() {
            clearGroup();
            const R = 0.35;
            const a = (4 * R) / Math.sqrt(3);

            const half = a / 2;
            const planes = [
                new THREE.Plane(new THREE.Vector3(1, 0, 0), half),
                new THREE.Plane(new THREE.Vector3(-1, 0, 0), half),
                new THREE.Plane(new THREE.Vector3(0, 1, 0), half),
                new THREE.Plane(new THREE.Vector3(0, -1, 0), half),
                new THREE.Plane(new THREE.Vector3(0, 0, 1), half),
                new THREE.Plane(new THREE.Vector3(0, 0, -1), half)
            ];

            currentGroup.add(createUnitCellWireframe(a, a, a));

            const positions = [
                // Köşeler
                [-half, -half, -half], [half, -half, -half], [-half, half, -half], [half, half, -half],
                [-half, -half, half],  [half, -half, half],  [-half, half, half],  [half, half, half],
                // Tam Merkez
                [0, 0, 0]
            ];

            positions.forEach(pos => {
                currentGroup.add(createAtomWithClipping(pos[0], pos[1], pos[2], R, planes));
            });
        }

// --- HCP Yapısı (Kırpma Düzlemleri Eklenmiş) ---
function buildHCP() {
    clearGroup();
    const R = 0.35;
    const a = 2 * R;
    const c = a * Math.sqrt(8/3);

    // Altıgen Prizmanın 8 Sınır Düzlemi (Clipping Planes)
    const planes = [
        // Üst ve Alt Düzlemler
        new THREE.Plane(new THREE.Vector3(0, -1, 0), c / 2),
        new THREE.Plane(new THREE.Vector3(0, 1, 0), c / 2)
    ];

    // 6 Yan Yüzey Düzlemi (Apothem mesafesi: a * sqrt(3) / 2)
    const apothem = (a * Math.sqrt(3)) / 2;
    for (let i = 0; i < 6; i++) {
        const angle = (i * Math.PI) / 3 + Math.PI / 6;
        const normal = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
        planes.push(new THREE.Plane(normal, apothem));
    }

    // Altıgen Prizma Tel Çerçevesi
    const hexGroup = new THREE.Group();
    const wireMat = new THREE.LineBasicMaterial({ color: 0xaaaaaa });

    for (let layer of [-c/2, c/2]) {
        const pts = [];
        for (let i = 0; i <= 6; i++) {
            const angle = (i * Math.PI) / 3;
            pts.push(new THREE.Vector3(a * Math.cos(angle), layer, a * Math.sin(angle)));
        }
        const hexGeo = new THREE.BufferGeometry().setFromPoints(pts);
        hexGroup.add(new THREE.Line(hexGeo, wireMat));
    }

    for (let i = 0; i < 6; i++) {
        const angle = (i * Math.PI) / 3;
        const x = a * Math.cos(angle);
        const z = a * Math.sin(angle);
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(x, -c/2, z),
            new THREE.Vector3(x, c/2, z)
        ]);
        hexGroup.add(new THREE.Line(lineGeo, wireMat));
    }
    currentGroup.add(hexGroup);

    // Atom Pozisyonları
    const positions = [];
    // Alt ve üst katmanlar (Köşeler + Taban Merkezleri)
    for (let layer of [-c/2, c/2]) {
        positions.push([0, layer, 0]);
        for (let i = 0; i < 6; i++) {
            const angle = (i * Math.PI) / 3;
            positions.push([a * Math.cos(angle), layer, a * Math.sin(angle)]);
        }
    }
    // İç katmandaki 3 atom
    const r_mid = a / Math.sqrt(3);
    positions.push([r_mid * Math.cos(Math.PI/6), 0, r_mid * Math.sin(Math.PI/6)]);
    positions.push([r_mid * Math.cos(5*Math.PI/6), 0, r_mid * Math.sin(5*Math.PI/6)]);
    positions.push([r_mid * Math.cos(3*Math.PI/2), 0, r_mid * Math.sin(3*Math.PI/2)]);

    // Atomları kırpma düzlemleri ile oluşturma
    positions.forEach(pos => {
        currentGroup.add(createAtomWithClipping(pos[0], pos[1], pos[2], R, planes));
    });
}
